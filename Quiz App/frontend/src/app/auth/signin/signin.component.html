<div style="display: flex; justify-content: center; margin-top: 50px;">
    <form (submit)="signIn()" 
          style="width: 40%; padding: 20px; 
                 background: linear-gradient(135deg, rgba(0, 123, 255, 0.3), rgba(40, 167, 69, 0.3), rgba(255, 193, 7, 0.3)); 
                 backdrop-filter: blur(10px); 
                 box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); 
                 border-radius: 15px; 
                 display: flex; flex-direction: column; align-items: center;">
      
      <h2 style="color: #2c3e50; font-family: Arial, sans-serif; margin-bottom: 20px;">Sign In</h2>
  
      <!-- Email Field -->
      <label for="email" style="align-self: flex-start; margin-left: 10%; font-size: 14px; font-weight: bold; color: #2c3e50;">Email:</label>
      <input type="email" id="email" placeholder="Enter your email" [(ngModel)]="email" name="email" required
             style="width: 80%; padding: 12px; margin: 5px 0 15px; border: 1px solid #bdc3c7; 
                    border-radius: 8px; font-size: 16px; background: transparent; color: black;" 
             onfocus="this.placeholder=''" onblur="this.placeholder='Enter your email'" />
  
      <!-- Password Field -->
      <label for="password" style="align-self: flex-start; margin-left: 10%; font-size: 14px; font-weight: bold; color: #2c3e50;">Password:</label>
      <input type="password" id="password" placeholder="Enter your password" [(ngModel)]="password" name="password" required
             style="width: 80%; padding: 12px; margin: 5px 0 15px; border: 1px solid #bdc3c7; 
                    border-radius: 8px; font-size: 16px; background: transparent; color: black;" 
             onfocus="this.placeholder=''" onblur="this.placeholder='Enter your password'" />
  
      <!-- Sign In Button -->
      <button type="submit"
              style="width: 85%; padding: 12px; margin-top: 15px; background: linear-gradient(45deg, #007bff, #28a745, #ffc107);
                     color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer;
                     transition: all 0.3s;">
        Sign In
      </button>
  
      <!-- Navigation to Sign Up -->
      <button type="button" (click)="navigateToSignUp()"
              style="width: 85%; padding: 10px; margin-top: 10px; background: transparent; border: 1px solid #2c3e50; 
                     border-radius: 8px; font-size: 16px; color: #2c3e50; cursor: pointer; transition: all 0.3s;">
        Don't have an account? Sign Up
      </button>
  
    </form>
  </div>
