<h2 style="text-align: center; color: #2c3e50; font-family: Arial, sans-serif; margin-bottom: 20px;">
    Test
  </h2>
  
  <div style="display: flex; justify-content: center;">
    <div *ngIf="questions.length > 0" 
         style="width: 50%; padding: 20px; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2); 
                border-radius: 10px; background-color: #f8f9fa; text-align: center;">
  
      <p style="font-size: 18px; font-weight: bold; color: #2c3e50;">
        {{ currentQuestionIndex + 1 }}. {{ questions[currentQuestionIndex]?.question }}
      </p>
  
      <div *ngFor="let option of questions[currentQuestionIndex]?.options" 
           style="margin: 10px; padding: 10px; border-radius: 5px; background-color: #ecf0f1;
                  transition: 0.3s; cursor: pointer;"
           (click)="selectAnswer(currentQuestionIndex, option)">
        <input type="radio" 
               [name]="'question' + currentQuestionIndex" 
               [value]="option" 
               [checked]="selectedAnswers[currentQuestionIndex] === option" />
        {{ option }}
      </div>
  
      <button (click)="clearAnswer()" 
              style="margin: 10px; padding: 10px 15px; background-color: #e74c3c; 
                     color: white; border: none; border-radius: 5px; cursor: pointer;">
        Clear Answer
      </button>
  
      <div style="margin-top: 15px;">
        <button (click)="prevQuestion()" 
                [disabled]="currentQuestionIndex === 0"
                style="margin: 5px; padding: 10px 15px; background-color: #3498db; color: white; 
                       border: none; border-radius: 5px; cursor: pointer;">
          Previous
        </button>
  
        <button (click)="nextQuestion()" 
                [disabled]="currentQuestionIndex === questions.length - 1"
                style="margin: 5px; padding: 10px 15px; background-color: #2ecc71; color: white; 
                       border: none; border-radius: 5px; cursor: pointer;">
          Next
        </button>
      </div>
    </div>
  </div>
  
  <!-- Submit Button -->
  <div style="text-align: center; margin-top: 20px;">
    <button (click)="submitTest()" 
            style="padding: 12px 20px; background-color: #27ae60; color: white; 
                   border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
      Submit Test
    </button>
  </div>
  
  <!-- Display Score -->
  <div *ngIf="score !== null" style="text-align: center; margin-top: 20px; font-size: 20px; font-weight: bold;">
    <h3>Your Score: {{ score }} / {{ questions.length }}</h3>
  </div>
