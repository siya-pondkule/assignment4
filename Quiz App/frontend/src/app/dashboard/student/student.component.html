<h2 style="text-align: center; color: #2c3e50; font-family: Arial, sans-serif;">Student Dashboard</h2>

<!-- Button to navigate to the Test Page -->
<div style="text-align: center; margin-top: 20px;">
  <button (click)="navigateToTest()" 
    style="background-color: #27ae60; color: white; padding: 12px 24px; border: none; 
    border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; 
    transition: 0.3s; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);">
    Give Test
  </button>
</div>
